[project]
name = "neodb-portal"
version = "0.1.0"
description = "Pairing service that lets a device sign in to NeoDB by scanning a QR code."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sentry-sdk>=2.0",
]

[project.scripts]
neodb-portal = "neodb_portal.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "sentry-sdk>=2.0",
    "pre-commit>=4.0",
    "ruff>=0.15",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neodb_portal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["neodb_portal", "tests"]
exclude = [".venv", ".git"]
lint.ignore = ["F403", "F405"]

[tool.ty.environment]
root = ["."]
